# Copy this file to rorywag/KQL-Detections at .github/workflows/trigger-site-rebuild.yml
# It does nothing in the sleuthifer-blog repo. See README.md in this folder for setup.
#
# On every push to KQL-Detections' main branch, this asks rorywag/sleuthifer-blog
# to rebuild and redeploy the site, so the Detections section picks up the change.

name: Trigger Sleuthifer site rebuild

on:
  push:
    branches: [main]
  workflow_dispatch:

# The dispatch uses the PAT below, not GITHUB_TOKEN, so this workflow needs no
# permissions of its own.
permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Send repository_dispatch to rorywag/sleuthifer-blog
        env:
          # Fine-grained PAT stored as a repository secret. Never paste the token here.
          GH_TOKEN: ${{ secrets.SITE_DISPATCH_TOKEN }}
        run: |
          gh api --method POST repos/rorywag/sleuthifer-blog/dispatches \
            -f event_type=kql-detections-updated \
            -f "client_payload[sha]=${{ github.sha }}"
