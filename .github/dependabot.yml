# Weekly update PRs for the pinned GitHub Actions (commit SHAs in
# .github/workflows/) and the Python build dependencies (requirements.in, compiled
# into the hashed requirements.txt lockfile with pip-compile).
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
