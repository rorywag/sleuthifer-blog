name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  # Sent by rorywag/KQL-Detections on every push, so the Detections section
  # rebuilds when a detection changes. See integrations/kql-detections/README.md.
  repository_dispatch:
    types: [kql-detections-updated]

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one deployment at a time, but don't cancel a run that's in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The RSS and revision-date plugins read page dates from the full git history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # System libraries for the social plugin's card rendering (Material's documented list).
      - name: Install image libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant

      - name: Install dependencies
        run: pip install -r requirements.txt

      # scripts/gen_detections.py builds the Detections section from this clone.
      # Full history, because page dates come from the detection files' git log.
      - name: Clone KQL-Detections
        run: git clone https://github.com/rorywag/KQL-Detections.git .cache/kql-detections

      - uses: actions/configure-pages@v6

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site/
          # Every image lives under site/.gitbook/assets, which is skipped by default.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
