name: Deploy site to GitHub Pages

# The Detections section is built from rorywag/KQL-Detections at build time, so
# detection updates arrive via the nightly schedule or a manual run (Actions tab >
# Deploy site to GitHub Pages > Run workflow). Pushes to main deploy immediately.
on:
  push:
    branches: [main]
  schedule:
    # 15:07 UTC daily: early morning in New Zealand (03:07 NZST, 04:07 NZDT).
    # Off the top of the hour, when GitHub's scheduled runs are most often delayed.
    - cron: "7 15 * * *"
  workflow_dispatch:

# Nothing by default; each job asks for only what it needs.
permissions: {}

# Allow one deployment at a time, but don't cancel a run that's in progress.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # The build runs third-party packages and renders content from KQL-Detections, so
  # it only gets read access. Actions are pinned to full commit SHAs (Dependabot
  # keeps them current, see .github/dependabot.yml).
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The RSS and revision-date plugins read page dates from the full git history.
          fetch-depth: 0
          # Don't leave the token in .git/config for the rest of the job.
          persist-credentials: false

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # System libraries for the social plugin's card rendering (Material's documented list).
      - name: Install image libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libfreetype6-dev libffi-dev libjpeg-dev libpng-dev libz-dev pngquant

      # requirements.txt is a hashed lockfile compiled from requirements.in.
      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt

      # scripts/gen_detections.py builds the Detections section from this clone.
      # Full history, because page dates come from the detection files' git log.
      - name: Clone KQL-Detections
        # core.symlinks=false checks symlinks out as plain files, so a symlink in that
        # repo can't point the generator at files outside the clone.
        run: git clone -c core.symlinks=false https://github.com/rorywag/KQL-Detections.git .cache/kql-detections

      - name: Build site
        run: mkdocs build --strict

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/
          # Every image lives under site/.gitbook/assets, which is skipped by default.
          include-hidden-files: true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Reads the repo's Pages settings, which needs the pages permission, so it runs
      # here rather than in the read-only build job. Its outputs aren't used.
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
