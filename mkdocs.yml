site_name: Sleuthifer
site_description: Notes on digital forensics, incident response, memory analysis and KQL for Sentinel.
site_url: https://sleuthifer.nz/
repo_url: https://github.com/rorywag/sleuthifer-blog
repo_name: rorywag/sleuthifer-blog
# Shown in the footer of every page. Credits the Twemoji emoji used as the logo (CC-BY 4.0).
copyright: >-
  The mask logo is the <a href="https://github.com/jdecked/twemoji">Twemoji</a> emoji
  U+1F479, © Twitter, Inc and other contributors, licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY 4.0</a>.
edit_uri: edit/main/docs/

docs_dir: docs

# MkDocs skips dot-directories by default. The images from the GitBook export
# live in .gitbook/assets, so re-include it.
exclude_docs: |
  !.gitbook/

theme:
  name: material
  custom_dir: overrides
  # Mask logo: Twemoji emoji U+1F479, CC-BY 4.0. Credited in the site footer (copyright below).
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  # Colours are custom (steel blue primary, toned mask-red accent), defined as CSS
  # custom properties in docs/stylesheets/extra.css. Dark (slate) stays first, so
  # it's the default, with the toggle to light.
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  # IBM Plex Sans for body text and headings, IBM Plex Mono for code (fenced and
  # inline). The privacy plugin (below) downloads them from Google Fonts at build
  # time and serves them from the site, so visitors never contact Google.
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  features:
    # Instant navigation: internal links load in place (XHR) without a full page
    # reload. The progress bar shows on slower loads (over 400ms), and prefetch
    # starts loading a page when its link is hovered. The mask behaviours and
    # GoatCounter (docs/javascripts/) re-run on each page via Material's document$.
    - navigation.instant
    - navigation.instant.progress
    - navigation.instant.prefetch
    # Top-level nav entries become header tabs; the sidebar shows only the
    # current tab's pages.
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Posts live in docs/blog/posts/ and are served at /blog/<slug>/. Each post takes
  # one category (Digital Forensics, Incident Response or Memory Analysis); the
  # category pages at /blog/category/<name>/ are the topical indexes, with their
  # intro text in docs/blog/category/. The archive (by month) is off because every
  # post carries the same date, so it would be a single entry.
  - blog:
      blog_toc: true
      post_url_format: "{slug}"
      post_readtime: true
      archive: false
      authors: false
      categories_allowed:
        - Digital Forensics
        - Incident Response
        - Memory Analysis
  # Builds the Detections section from rorywag/KQL-Detections at build time,
  # in memory only. See scripts/gen_detections.py.
  - gen-files:
      scripts:
        - scripts/gen_detections.py
  # Expands the "detections/" nav entry from the generated detections/NAV.md. Not
  # SUMMARY.md: literate-nav would pick up the GitBook docs/SUMMARY.md as the whole nav.
  - literate-nav:
      nav_file: NAV.md
  # Tactic tags on detection pages, listed on detections/tactics.md.
  - tags
  # Dates come from git history, so the deploy workflow checks out with fetch-depth: 0.
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      # Generated detection pages have no history in this repo; their dates come
      # from the detection header and the KQL-Detections git log instead. The home
      # page is a landing page, so it shows no "last updated" date.
      exclude:
        - detections/*
        - README.md
  # Writes feed_rss_created.xml (new pages only) and feed_rss_updated.xml (every change).
  # docs/subscribe.md (opened from the nav and the footer RSS icon) lists the created feed;
  # the updated feed is still built, so anyone already subscribed to it keeps getting it.
  - rss:
      # Use each page's front-matter description as the item summary. 0 turns off the
      # fallback to the first N characters of markdown, where tab and code markup leaked
      # into excerpts. A page with no description now fails the strict build.
      abstract_chars_count: 0
      # Blog posts set "date" in front matter; "updated" falls back to git history.
      date_from_meta:
        as_creation: date
        as_update: updated
      # Feeds list blog posts only, matched against each page's source path. Every
      # other page (home, blog index and categories, Detections, Tools, Useful Links,
      # Subscribe) stays out without needing to be listed.
      match_path: '^blog/posts/.+\.md$'
      image: https://sleuthifer.nz/assets/images/logo.png
      # No XSLT: the default ("auto") adds an <?xml-stylesheet?> reference to rss.xsl
      # so browsers render the feed as a page, and browsers now show a deprecation
      # warning for XSLT. An empty value serves the feeds as plain XML.
      stylesheet: ""
  # Preview images for links shared on LinkedIn, Slack, etc. Needs mkdocs-material[imaging]
  # and the cairo/freetype system libraries.
  - social:
      # The palette is "custom", which the card renderer can't read, so give it the
      # steel blue primary (#3a5e88) and white text directly (6.7:1).
      cards_layout_options:
        background_color: "#3a5e88"
        color: "#ffffff"
  # Old article URLs from before the blog (GitBook paths) redirect to their blog
  # post. Former sub-pages of the merged guides land on their section's heading, and
  # the old section overviews land on the matching blog category.
  # Downloads external assets (the Google Fonts stylesheet and font files) at build
  # time into assets/external/ and rewrites pages to use the local copies, so no
  # page makes runtime requests to fonts.googleapis.com or fonts.gstatic.com.
  - privacy:
      # Material's bundle references Mermaid on unpkg.com, but only loads it on a
      # page with a Mermaid diagram, and this site has none. Excluding it avoids
      # downloading a 3 MB library into every build.
      assets_exclude:
        - unpkg.com/mermaid@*
  - redirects:
      redirect_maps:
        digital-forensics/README.md: blog/category/digital-forensics.md
        digital-forensics/cipher.md: blog/posts/cipher.md
        digital-forensics/powershell-history.md: blog/posts/powershell-history.md
        digital-forensics/file-carving/README.md: blog/posts/file-carving.md
        digital-forensics/file-carving/fat32-file-carving.md: blog/posts/file-carving.md#fat32-file-carving
        digital-forensics/untitled/README.md: blog/posts/ftk-imager.md
        digital-forensics/untitled/imaging-and-verifying.md: blog/posts/ftk-imager.md#imaging-verifying
        digital-forensics/wireshark/README.md: blog/posts/wireshark.md
        digital-forensics/wireshark/protocol-summary-and-dhcp.md: blog/posts/wireshark.md#protocol-summary-and-dhcp
        digital-forensics/wireshark/simple-mail-transfer-protocol-smtp.md: blog/posts/wireshark.md#follow-tcp-stream-and-smtp
        ir/README.md: blog/category/incident-response.md
        ir/youve-been-hit-popped-or-breached.md: blog/posts/youve-been-hit-popped-or-breached.md
        ir/threat-intelligence.md: blog/posts/threat-intelligence.md
        memory-analysis/README.md: blog/category/memory-analysis.md
        memory-analysis/part1-memory-and-volatility.md: blog/posts/part1-memory-and-volatility.md

hooks:
  - hooks/rss_social_cards.py
  - hooks/exclude_generated_nav.py

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rorywagner/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/rorywag
      name: GitHub
    # Links to the Subscribe page, which lists both feeds. Absolute, because Material
    # writes social links into href as-is and a relative path breaks on nested pages.
    - icon: fontawesome/solid/square-rss
      link: https://sleuthifer.nz/subscribe/
      name: Subscribe via RSS

# Colours, home page hero and the raised content panel.
extra_css:
  - stylesheets/extra.css

extra_javascript:
  # The mask logo's idle, blink, hover and click behaviours (header and home hero).
  - javascripts/mask.js
  # GoatCounter page views (cookieless), counted on every page including instant
  # navigation changes. See the script for how.
  - javascripts/analytics.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # :fontawesome-...: icons, used for the LinkedIn and GitHub links on the home page.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  # Pygments ships lexers for both "kql" (alias of kusto) and "powershell".
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

# Each top-level entry is a header tab. Blog posts and category pages are added
# under Blog by the blog plugin; Detections is expanded from its generated NAV.md.
nav:
  - Home: README.md
  - Blog:
      - blog/index.md
  - Detections: detections/
  - Tools: tools.md
  - Useful Links: useful-links.md
  - Subscribe: subscribe.md
