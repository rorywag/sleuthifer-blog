site_name: Sleuthifer
site_description: Notes on digital forensics, incident response, memory analysis and KQL for Sentinel.
site_url: https://rorywag.github.io/sleuthifer-blog/
repo_url: https://github.com/rorywag/sleuthifer-blog
repo_name: rorywag/sleuthifer-blog
# Shown in the footer of every page. Credits the Twemoji ogre used as the logo (CC-BY 4.0).
copyright: >-
  The ogre logo is the <a href="https://github.com/jdecked/twemoji">Twemoji</a> ogre emoji
  (U+1F479), © Twitter, Inc and other contributors, licensed under
  <a href="https://creativecommons.org/licenses/by/4.0/">CC-BY 4.0</a>.
edit_uri: edit/main/docs/

docs_dir: docs

# MkDocs skips dot-directories by default. GitBook stores every image in
# .gitbook/assets, so re-include it. SUMMARY.md only drives the nav below.
exclude_docs: |
  !.gitbook/
  SUMMARY.md

theme:
  name: material
  custom_dir: overrides
  # Ogre emoji (U+1F479) from Twemoji, CC-BY 4.0. Credited in the site footer (copyright below).
  logo: assets/images/logo.png
  favicon: assets/images/favicon.ico
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  # Builds the Detections section from rorywag/KQL-Detections at build time,
  # in memory only. See scripts/gen_detections.py.
  - gen-files:
      scripts:
        - scripts/gen_detections.py
  # Expands the "detections/" nav entry from the generated detections/NAV.md. Not
  # SUMMARY.md: literate-nav would pick up the GitBook docs/SUMMARY.md as the whole nav.
  - literate-nav:
      nav_file: NAV.md
  # Tactic tags on detection pages, listed on detections/tactics.md.
  - tags
  # Dates come from git history, so the deploy workflow checks out with fetch-depth: 0.
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
      # Generated detection pages have no history in this repo; their dates come
      # from the detection header and the KQL-Detections git log instead.
      exclude:
        - detections/*
  # Writes feed_rss_created.xml (new pages only) and feed_rss_updated.xml (every change).
  # The created feed is the main subscribe link (nav + footer); the updated feed is footer only.
  - rss:
      # Use each page's front-matter description as the item summary. 0 turns off the
      # fallback to the first N characters of markdown, where tab and code markup leaked
      # into excerpts. A page with no description now fails the strict build.
      abstract_chars_count: 0
      # Generated detection pages carry their own dates: "date" from the detection's
      # Date header, "updated" from its last commit in KQL-Detections. Pages without
      # these keys still use this repo's git history. Detections are currently kept
      # out of the feeds (match_path below); this stays so they date correctly if
      # they're ever included again.
      date_from_meta:
        as_creation: date
        as_update: updated
      # Feeds list written notes and articles only. Matched against each page's source
      # path. Excluded: the home page and top-level section overviews (README.md or
      # index.md at the root or one folder deep), the whole detections/ tree, Tools and
      # Useful Links. Everything deeper is included, so sub-section landings that are
      # real articles (File Carving, FTK Imager, Wireshark) and any new post appear
      # without editing this. The 404 page and the Subscribe via RSS nav link aren't
      # markdown pages, so they never reach the feeds.
      match_path: '^(?!(?:[^/]+/)?(?:README|index)\.md$|detections/|(?:tools|useful-links)\.md$).+\.md$'
      image: https://rorywag.github.io/sleuthifer-blog/assets/images/logo.png
      # No XSLT: the default ("auto") adds an <?xml-stylesheet?> reference to rss.xsl
      # so browsers render the feed as a page, and browsers now show a deprecation
      # warning for XSLT. An empty value serves the feeds as plain XML.
      stylesheet: ""
  # Preview images for links shared on LinkedIn, Slack, etc. Needs mkdocs-material[imaging]
  # and the cairo/freetype system libraries.
  - social

hooks:
  - hooks/rss_social_cards.py
  - hooks/exclude_generated_nav.py

extra:
  social:
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/rorywagner/
      name: LinkedIn
    - icon: fontawesome/brands/github
      link: https://github.com/rorywag
      name: GitHub
    - icon: fontawesome/solid/square-rss
      link: https://rorywag.github.io/sleuthifer-blog/feed_rss_created.xml
      name: Subscribe via RSS (new pages)
    - icon: material/update
      link: https://rorywag.github.io/sleuthifer-blog/feed_rss_updated.xml
      name: RSS feed of all page updates

# Home page hero and card layout.
extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  # :material-...: and :fontawesome-...: icons, used on the home page cards.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  # Pygments ships lexers for both "kql" (alias of kusto) and "powershell".
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true

# Mirrors docs/SUMMARY.md (the GitBook table of contents), plus the RSS subscribe link.
nav:
  - What is this?: README.md
  - Digital Forensics:
      - digital-forensics/README.md
      - Cipher (Anti-forensics): digital-forensics/cipher.md
      - PowerShell History: digital-forensics/powershell-history.md
      - File Carving:
          - digital-forensics/file-carving/README.md
          - FAT32 File Carving: digital-forensics/file-carving/fat32-file-carving.md
      - FTK Imager:
          - digital-forensics/untitled/README.md
          - Imaging & Verifying: digital-forensics/untitled/imaging-and-verifying.md
      - Wireshark:
          - digital-forensics/wireshark/README.md
          - Protocol Summary and DHCP: digital-forensics/wireshark/protocol-summary-and-dhcp.md
          - Follow TCP Stream and SMTP: digital-forensics/wireshark/simple-mail-transfer-protocol-smtp.md
  - Incident Response:
      - ir/README.md
      - You've been hit, popped or breached?: ir/youve-been-hit-popped-or-breached.md
      - Threat Intelligence & Intrusion Analysis: ir/threat-intelligence.md
  - Memory Analysis:
      - memory-analysis/README.md
      - "Part 1: Memory and Volatility": memory-analysis/part1-memory-and-volatility.md
  - Detections: detections/
  - Tools: tools.md
  - Useful Links: useful-links.md
  - Subscribe via RSS: https://rorywag.github.io/sleuthifer-blog/feed_rss_created.xml
